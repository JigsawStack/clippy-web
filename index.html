<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>clippy-web demo</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f7f9;
        --card: #ffffff;
        --text: #102a43;
        --muted: #486581;
        --primary: #0f766e;
        --primary-soft: #d9f4f0;
        --border: #d9e2ec;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Avenir Next", "Segoe UI", sans-serif;
        background: radial-gradient(circle at top right, #d9f4f0, var(--bg) 40%);
        color: var(--text);
      }

      .container {
        max-width: 1100px;
        margin: 0 auto;
        padding: 20px;
      }

      #demo-status {
        margin-top: 8px;
        margin-bottom: 6px;
        color: var(--muted);
        font-size: 14px;
      }

      h1 {
        margin-top: 26px;
        margin-bottom: 8px;
      }

      .grid {
        margin-top: 20px;
        display: grid;
        grid-template-columns: 1.2fr 1fr;
        gap: 16px;
      }

      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 16px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th,
      td {
        text-align: left;
        border-bottom: 1px solid var(--border);
        padding: 10px 4px;
      }

      .row-action {
        border: 1px solid var(--primary);
        border-radius: 8px;
        background: transparent;
        color: var(--primary);
        padding: 6px 10px;
        cursor: pointer;
      }

      .field {
        display: grid;
        gap: 6px;
        margin-bottom: 12px;
      }

      .field input,
      .field select,
      .field textarea {
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 9px 10px;
        width: 100%;
        font: inherit;
      }

      .checklist {
        display: grid;
        gap: 8px;
        margin: 10px 0 14px;
      }

      .checklist label {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .submit {
        border: none;
        border-radius: 10px;
        background: #14532d;
        color: #fff;
        padding: 10px 12px;
        font-weight: 600;
        cursor: pointer;
      }

      @media (max-width: 900px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="container">
      <div id="demo-status">Starting Clippy from .env...</div>

      <h1>Workspace Settings</h1>
      <p>This page is intentionally dense so the virtual cursor can demonstrate multi-step guidance.</p>

      <section class="grid">
        <article class="card">
          <h2>Plans Table</h2>
          <table>
            <thead>
              <tr>
                <th>Plan</th>
                <th>Seats</th>
                <th>Price</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>Starter</td>
                <td>3</td>
                <td>$19</td>
                <td><button class="row-action" type="button">Choose Starter</button></td>
              </tr>
              <tr>
                <td>Growth</td>
                <td>15</td>
                <td>$79</td>
                <td><button class="row-action" type="button">Choose Growth</button></td>
              </tr>
              <tr>
                <td>Enterprise</td>
                <td>Unlimited</td>
                <td>$249</td>
                <td><button class="row-action" type="button">Contact Sales</button></td>
              </tr>
            </tbody>
          </table>
        </article>

        <article class="card">
          <h2>Account Form</h2>
          <div class="field">
            <label for="team-name">Team Name</label>
            <input id="team-name" type="text" placeholder="Northstar Product" />
          </div>
          <div class="field">
            <label for="owner-email">Owner Email</label>
            <input id="owner-email" type="email" placeholder="owner@company.com" />
          </div>
          <div class="field">
            <label for="workspace-region">Workspace Region</label>
            <select id="workspace-region">
              <option>Select region</option>
              <option>US East</option>
              <option>US West</option>
              <option>Europe</option>
            </select>
          </div>

          <h3>Enable Features</h3>
          <div class="checklist">
            <label><input type="checkbox" /> Billing alerts</label>
            <label><input type="checkbox" /> Product changelog emails</label>
            <label><input type="checkbox" /> Daily usage digest</label>
          </div>

          <div class="field">
            <label for="notes">Notes</label>
            <textarea id="notes" rows="3" placeholder="Add rollout notes..."></textarea>
          </div>

          <button class="submit" type="button">Save Workspace Settings</button>
        </article>
      </section>
    </main>

    <script src="./dist/clippy-web.iife.js"></script>
    <script src="./runtime-env.js"></script>
    <script>
      (function () {
        const status = document.getElementById("demo-status");
        const setStatus = function (message) {
          if (status) {
            status.textContent = message;
          }
        };

        const clippyGlobal = window.ClippyWeb;
        const initClippy =
          typeof clippyGlobal === "function"
            ? clippyGlobal
            : clippyGlobal && typeof clippyGlobal.default === "function"
              ? clippyGlobal.default
              : null;

        if (!initClippy) {
          setStatus("Missing or invalid dist bundle. Run: yarn build");
          return;
        }

        const apiKey =
          window.CLIPPY_WEB_ENV && typeof window.CLIPPY_WEB_ENV.VITE_INTERFAZE_API_KEY === "string"
            ? window.CLIPPY_WEB_ENV.VITE_INTERFAZE_API_KEY.trim()
            : "";

        if (!apiKey) {
          setStatus("Missing VITE_INTERFAZE_API_KEY. Run: yarn generate:env");
          return;
        }

        initClippy(apiKey, {
          debug: true,
          snapToDom: false,
          onTranscript: function (transcript) {
            setStatus("Transcribed: " + transcript);
          },
          onError: function (error) {
            setStatus("Error: " + (error && error.message ? error.message : "Unknown error"));
          }
        });

        setStatus("Clippy started from .env. Hold Option + X or use the floating record button.");
      })();
    </script>
  </body>
</html>
